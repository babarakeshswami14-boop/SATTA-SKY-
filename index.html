<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SATTA SKY - Results Chart</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eff9ff;
  color: #145779;
}

header {
  background: linear-gradient(110deg, #078bc1, #009a72);
  color: white;
  padding: 22px 15px;
  border-bottom: 6px solid #ffda25;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 1000px;
  margin: auto;
}

.logo {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #ffda25;
  color: #145779;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 32px;
  font-weight: bold;
}

h1 {
  margin: 0;
  font-size: 27px;
}

.brand p {
  margin: 6px 0 0;
  letter-spacing: 3px;
  font-weight: bold;
}

main {
  max-width: 1000px;
  margin: 25px auto;
  padding: 0 12px;
}

.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

button, select, input {
  padding: 11px;
  border-radius: 9px;
  border: 1px solid #c8e4ef;
  font-size: 15px;
}

button {
  cursor: pointer;
  background: #078bc1;
  color: white;
  border: none;
  font-weight: bold;
}

select {
  background: white;
  color: #145779;
}

.chart {
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 5px 20px #14577918;
}

.chart-title {
  background: linear-gradient(110deg, #078bc1, #009a72);
  color: white;
  padding: 22px 8px;
  text-align: center;
  font-size: 23px;
  font-weight: bold;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #fffde9;
  padding: 15px 5px;
}

td {
  text-align: center;
  padding: 12px 4px;
  font-weight: bold;
  border-bottom: 1px solid #edf4f7;
}

tr:nth-child(even) {
  background: #f1f9fd;
}

th:first-child, td:first-child {
  text-align: left;
  padding-left: 12px;
}

.sunday {
  background: #fff0f2 !important;
  color: #d32f56;
}

.number {
  display: inline-block;
  min-width: 43px;
  padding: 9px 4px;
  background: #d0f8e7;
  border: 1px solid #aceed3;
  border-radius: 12px;
  color: #12644e;
  font-size: 17px;
}

.empty {
  color: #c5cfd6;
}

.admin {
  margin-top: 22px;
  padding: 18px;
  background: white;
  border-radius: 16px;
}

.admin h2 {
  margin-top: 0;
}

.admin input {
  width: 100%;
  margin: 5px 0 12px;
}

.hidden {
  display: none;
}

.note {
  color: #7b909c;
  font-size: 13px;
  line-height: 1.5;
}

@media(max-width: 500px) {
  h1 {
    font-size: 24px;
  }

  .chart-title {
    font-size: 19px;
  }

  th, td {
    padding: 11px 3px;
    font-size: 13px;
  }

  .number {
    min-width: 35px;
    font-size: 15px;
    padding: 8px 2px;
  }

  .controls select {
    flex: 1;
    min-width: 0;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">ϟ</div>
    <div>
      <h1>SATTA SKY</h1>
      <p>RESULTS CHART</p>
    </div>
  </div>
</header>

<main>

  <div class="controls">
    <button onclick="changeMonth(-1)">❮</button>

    <select id="month"></select>

    <select id="year"></select>

    <button onclick="changeMonth(1)">❯</button>

    <button onclick="toggleAdmin()">Admin Panel</button>
  </div>

  <section class="chart">
    <div class="chart-title" id="chartTitle">
      MONTHLY RESULT CHART
    </div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>DSWR</th>
          <th>FRBD</th>
          <th>GZBD</th>
          <th>GALI</th>
        </tr>
      </thead>

      <tbody id="results"></tbody>
    </table>
  </section>

  <section class="admin hidden" id="admin">
    <h2>Manage Results</h2>

    <p class="note">
      Choose a date and enter its results.
    </p>

    <label>Date</label>
    <input type="date" id="entryDate">

    <label>DSWR</label>
    <input id="dswr" maxlength="2" inputmode="numeric">

    <label>FRBD</label>
    <input id="frbd" maxlength="2" inputmode="numeric">

    <label>GZBD</label>
    <input id="gzbd" maxlength="2" inputmode="numeric">

    <label>GALI</label>
    <input id="gali" maxlength="2" inputmode="numeric">

    <button onclick="saveResult()">Save Result</button>
    <button onclick="deleteResult()">Delete Result</button>

    <p id="message" class="note"></p>

    <p class="note">
      Demo version: results are saved only in this browser.
      Sup
